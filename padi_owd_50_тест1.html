<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADI Open Water Diver — Разбор экзамена</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --correct-bg: #e8f5e9;
            --correct-border: #4caf50;
            --correct-text: #2e7d32;
            --wrong-bg: #ffebee;
            --wrong-border: #ef5350;
            --wrong-text: #c62828;
            --accent-bg: #e3f2fd;
            --accent-border: #2196f3;
            --accent-text: #1565c0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #1a252f;
        }

        .score-badge {
            display: inline-block;
            font-size: 2rem;
            font-weight: bold;
            color: #4caf50;
            background: #e8f5e9;
            padding: 10px 25px;
            border-radius: 50px;
            margin: 15px 0;
            border: 2px solid #4caf50;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-filter:hover, .btn-filter.active {
            background: #1e293b;
            color: #ffffff;
            border-color: #1e293b;
        }

        .q-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 6px solid #ccc;
        }

        .q-card.status-correct {
            border-left-color: var(--correct-border);
        }

        .q-card.status-wrong {
            border-left-color: var(--wrong-border);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .q-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-correct {
            background: var(--correct-bg);
            color: var(--correct-text);
        }

        .badge-wrong {
            background: var(--wrong-bg);
            color: var(--wrong-text);
        }

        .answer-box {
            padding: 10px 15px;
            border-radius: 6px;
            margin: 6px 0;
            font-size: 0.95rem;
        }

        .ans-user-wrong {
            background: var(--wrong-bg);
            color: var(--wrong-text);
            border: 1px solid var(--wrong-border);
        }

        .ans-correct {
            background: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .explanation {
            background: var(--accent-bg);
            color: var(--accent-text);
            border: 1px solid #bbdefb;
            padding: 12px 15px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>Результаты контрольного экзамена PADI OWD</h1>
        <div class="score-badge">45 / 50 (90%) — СДАНО!</div>
        <p>Минимальный проходной балл PADI: 75% (38 вопросов).</p>

        <div class="filters">
            <button class="btn-filter active" onclick="filterQuestions('all')">Все вопросы (50)</button>
            <button class="btn-filter" onclick="filterQuestions('wrong')" style="border-color: #ef5350; color: #c62828;">Только ошибки (5)</button>
            <button class="btn-filter" onclick="filterQuestions('correct')" style="border-color: #4caf50; color: #2e7d32;">Только верные (45)</button>
        </div>
    </div>

    <div id="questions-list"></div>
</div>

<script>
const questionsData = [
  { id: 1, text: "Каково абсолютное давление на глубине 30 метров в морской воде?", correct: "4 бар", user: "4 бар", isCorrect: true, exp: "1 бар (атмосфера) + 3 бар (30 м воды) = 4 бар." },
  { id: 2, text: "Баллон объемом 12 литров заправлен до давления 200 бар. Какой объем воздуха он содержит при 1 бар?", correct: "2400 литров", user: "2400 литров", isCorrect: true, exp: "12 л * 200 бар = 2400 литров." },
  { id: 3, text: "Каково самое главное и фундаментальное правило безопасности в дайвинге?", correct: "Непрерывно дышать и никогда не задерживать дыхание", user: "Непрерывно дышать и никогда не задерживать дыхание", isCorrect: true, exp: "Предотвращает баротравму легких при расширении воздуха." },
  { id: 4, text: "Как изменяется скорость расхода воздуха с увеличением глубины?", correct: "Увеличивается пропорционально окружающему давлению", user: "Увеличивается пропорционально окружающему давлению", isCorrect: true, exp: "Чем выше давление, тем плотнее воздух при каждом вдохе." },
  { id: 5, text: "Как называется баротравма при расширении застрявшего воздуха в полостях тела при всплытии?", correct: "Обратный блок (Reverse Block)", user: "Декомпрессионная болезнь", isCorrect: false, exp: "ОШИБКА: Расширение воздуха в замкнутых полостях (уши, пазухи) при подъеме — это обратный блок. Декомпрессионная болезнь вызывается пузырьками растворенного азота в крови и тканях." },
  { id: 6, text: "Основная функция компенсатора плавучести (BCD)?", correct: "Регулировать и поддерживать плавучесть на любой глубине и поверхности", user: "Регулировать и поддерживать плавучесть на любой глубине и поверхности", isCorrect: true, exp: "Обеспечивает нейтральную плавучесть под водой и положительную на поверхности." },
  { id: 7, text: "Что обозначает аббревиатура BWRAF при партнерской проверке?", correct: "BCD, Weights, Releases, Air, Final Check", user: "BCD, Weights, Releases, Air, Final Check", isCorrect: true, exp: "Базовая предпогружная проверка снаряжения напарника." },
  { id: 8, text: "Как правильно продуваться (выравнивать давление в ушах)?", correct: "Продуваться часто и мягко с самых первых метров спуска", user: "Продуваться часто и мягко с самых первых метров спуска", isCorrect: true, exp: "Нельзя ждать появления боли — продувка делается заранее и мягко." },
  { id: 9, text: "Что происходит с гидрокостюмом из неопрена на глубине 20 метров?", correct: "Неопрен сжимается под давлением, плавучесть уменьшается", user: "Неопрен сжимается под давлением, плавучесть уменьшается", isCorrect: true, exp: "Пузырьки воздуха в неопрене сжимаются, объем костюма и плавучесть падают." },
  { id: 10, text: "Самый тяжелый и опасный исход задержки дыхания при всплытии?", correct: "Баротравма легких и артериальная газовая эмболия", user: "Баротравма легких и артериальная газовая эмболия", isCorrect: true, exp: "Разрыв альвеол легких может привести к эмболии и смертельному исходу." },
  { id: 11, text: "Порядок действий при потере напарника под водой?", correct: "Искать под водой не более 1 минуты, затем осторожно всплыть на поверхность", user: "Искать под водой не более 1 минуты, затем осторожно всплыть на поверхность", isCorrect: true, exp: "Стандартное правило PADI: 1 минута поиска под водой, затем встречи на поверхности." },
  { id: 12, text: "Минимальное безопасное расстояние для судов от дайв-флага?", correct: "30–50 метров", user: "30–50 метров", isCorrect: true, exp: "Суда должны снижать скорость и проходить не ближе 30-50 метров от флага." },
  { id: 13, text: "Сигнал: сжатый кулак, поднесенный к центру груди?", correct: "У меня осталось мало воздуха (резерв / 50 бар)", user: "У меня осталось мало воздуха (резерв / 50 бар)", isCorrect: true, exp: "Кулак у груди информирует напарника об открытии резерва." },
  { id: 14, text: "Правильное действие при судороге икроножной мышцы?", correct: "Потянуть носок ласты на себя и распрямить ногу", user: "Потянуть носок ласты на себя и распрямить ногу", isCorrect: true, exp: "Растяжение мышцы вытягиванием ласты на себя снимает спазм." },
  { id: 15, text: "Максимальная глубина для сертификата PADI Open Water Diver?", correct: "18 метров", user: "18 метров", isCorrect: true, exp: "Предел любительского уровня OWD без сопровождения гида/инструктора." },
  { id: 16, text: "Симптомы отравления угарным газом (CO) в баллоне?", correct: "Головная боль, тошнота и неестественно ярко-красный цвет губ и ногтей", user: "Головная боль, тошнота и неестественно ярко-красный цвет губ и ногтей", isCorrect: true, exp: "CO связывает гемоглобин, окрашивая губы в ярко-алый цвет." },
  { id: 17, text: "Закончился воздух на глубине 6 м, напарник далеко. Оптимальное действие?", correct: "Controlled Emergency Swimming Ascent (CESA — аварийное всплытие плавом)", user: "Аварийное всплытие с сбросом грузов", isCorrect: false, exp: "ОШИБКА: С небольшой глубины (до 6-9 м) при отсутствии воздуха и далеком напарнике делают CESA (всплытие с непрерывным гудением 'ааа'). Сброс грузов применяют на больших глубинах как крайнюю меру." },
  { id: 18, text: "Первое действие с BCD сразу после выхода на поверхность?", correct: "Надуть BCD для обеспечения положительной плавучести", user: "Надуть BCD для обеспечения положительной плавучести", isCorrect: true, exp: "На поверхности первым делом создают положительную плавучесть." },
  { id: 19, text: "Максимальная скорость всплытия в любительском дайвинге?", correct: "Не более 18 метров в минуту (или по дайв-компьютеру)", user: "Не более 18 метров в минуту (или по дайв-компьютеру)", isCorrect: true, exp: "Стандарт PADI: 18 м/мин, многие компьютеры требуют не более 9-10 м/мин." },
  { id: 20, text: "Почему высокогорные погружения (выше 300 м) требуют особых процедур?", correct: "Давление на поверхности ниже 1 бар, что меняет расчет рассыщения азота", user: "Давление на поверхности ниже 1 бар, что меняет расчет рассыщения азота", isCorrect: true, exp: "Низкое атмосферное давление увеличивает перепад давления при всплытии." },
  { id: 21, text: "Главная функция манометра (SPG)?", correct: "Показывать остаток давления воздуха в баллоне", user: "Показывать остаток давления воздуха в баллоне", isCorrect: true, exp: "SPG показывает текущее давление дыхательной смеси." },
  { id: 22, text: "Факторы, сильно увеличивающие риск декомпрессионной болезни?", correct: "Обезвоживание, переохлаждение и тяжелые физические нагрузки после погружения", user: "Обезвоживание, переохлаждение и тяжелые физические нагрузки после погружения", isCorrect: true, exp: "Обезвоживание и нагрузка способствуют микропузырькам азота." },
  { id: 23, text: "Сигнал: рука движется ладонью/кулаком поперек шеи?", correct: "Закончился воздух (Out of Air)", user: "Закончился воздух (Out of Air)", isCorrect: true, exp: "Международный критический сигнал отсутствия воздуха." },
  { id: 24, text: "Минимальный интервал перед полетом после серии погружений?", correct: "18 часов", user: "18 часов", isCorrect: true, exp: "12 часов для одного погружения, 18 часов для повторных погружений за день." },
  {
    id: 25,
    text: "Главная цель остановки безопасности (Safety Stop) 3 мин на 5 м?",
    correct: "Позволить рассытиться избыточному азоту из тканей до выхода на поверхность",
    user: "Позволить рассытиться избыточному азоту из тканей до выхода на поверхность",
    isCorrect: true,
    exp: "Дает времени тканям безопасно вывести азот через дыхание."
  },
  { id: 26, text: "Действия дайвера при симптомах азотного наркоза на глубине 25 м?", correct: "Немедленно всплыть на меньшую глубину вместе с напарником", user: "Немедленно всплыть на меньшую глубину вместе с напарником", isCorrect: true, exp: "Подъем на меньшую глубину снимает симптомы азотного наркоза без последствий." },
  { id: 27, text: "Первая доврачебная помощь при подозрении на ДБ на поверхности?", correct: "Подача 100%-ного чистого кислорода и вызов экстренной медицинской службы", user: "Подача 100%-ного чистого кислорода и вызов экстренной медицинской службы", isCorrect: true, exp: "100% O2 вымывает азот из крови и питает поврежденные ткани." },
  { id: 28, text: "Почему под водой сложно определить направление на источник звука?", correct: "Звук распространяется в 4 раза быстрее; мозг не фиксирует задержку между ушами", user: "Звук распространяется в 4 раза быстрее; мозг не фиксирует задержку между ушами", isCorrect: true, exp: "Из-за высокой скорости звука в воде мозг слышит звук двумя ушами одновременно." },
  { id: 29, text: "Какой цвет спектра поглощается водой первым (уже на 4–5 м)?", correct: "Красный", user: "Красный", isCorrect: true, exp: "Красный цвет с длинной волной полностью отфильтровывается первым." },
  { id: 30, text: "Что делать, если дайв-компьютер показывает превышение предела NDL?", correct: "Выполнить декомпрессионные остановки согласно указаниям компьютера", user: "Выполнить декомпрессионные остановки согласно указаниям компьютера", isCorrect: true, exp: "Следует строго выполнять показания прибора по декомпрессионным остановкам." },
  { id: 31, text: "В каком направлении начинать погружение с бота при течении?", correct: "Пропротив течения", user: "Пропротив течения", isCorrect: true, exp: "Движение против течения в начале сохраняет силы для возвращения по течению." },
  { id: 32, text: "Как правильно хранить баллоны при длительном перерыве?", correct: "С небольшим избыточным давлением (10–20 бар) в вертикальном положении", user: "Заправленными до максимального рабочего давления 200 бар", isCorrect: false, exp: "ОШИБКА: Хранить баллоны заправленными до 200 бар нельзя из-за высокой постоянной нагрузки на стенки и вентиль. Но и пустыми оставлять нельзя — попадает влага. Хранят вертикально с 10-20 бар." },
  { id: 33, text: "Первое действие при панике или усталости на поверхности?", correct: "Обеспечить положительную плавучесть (надуть BCD или сбросить грузы)", user: "Обеспечить положительную плавучесть (надуть BCD или сбросить грузы)", isCorrect: true, exp: "Создание положительной плавучести останавливает погружение и экономит силы." },
  { id: 34, text: "Как удерживать магнитный компас во время движения по азимуту?", correct: "Строго горизонтально, сориентировав курсовую черту по центральной оси тела", user: "Вертикально прямо перед стеклом маски", isCorrect: false, exp: "ОШИБКА: Компас необходимо держать строго ГОРИЗОНТАЛЬНО, иначе его магнитная стрелка цепляется за корпус и дает ложные показания." },
  { id: 35, text: "Как расположить консоль и октопус для защиты кораллового рифа?", correct: "Закрепить все свисающие шланги в треугольнике безопасности BCD", user: "Закрепить все свисающие шланги в треугольнике безопасности BCD", isCorrect: true, exp: "Закрепленные приборы не ломают кораллы и не цепляются за препятствия." },
  { id: 36, text: "Самый распространенный вход в воду с высокого борта катера?", correct: "Шаг в неизвестность (Giant Stride)", user: "Кувырок назад (Back Roll)", isCorrect: false, exp: "ОШИБКА: С высоких платформ и больших катеров делают 'Шаг в неизвестность' (Giant Stride). Кувырок назад делают с низких надувных лодок (Zodiac/RIB)." },
  { id: 37, text: "Что такое термоклин (Thermocline)?", correct: "Резкая граница между слоями воды с разной температурой", user: "Резкая граница между слоями воды с разной температурой", isCorrect: true, exp: "Граница раздела между теплым верхним и холодным глубоким слоями." },
  { id: 38, text: "Как выравнивать давление под маской (устранять «обжим маски»)?", correct: "Выдуть немного воздуха носом внутрь маски", user: "Выдуть немного воздуха носом внутрь маски", isCorrect: true, exp: "Небольшой выдох носом выравнивает внутреннее давление маски с окружающим." },
  { id: 39, text: "Почему в соленой воде требуется больше грузов, чем в пресной?", correct: "Морская вода плотнее пресной и создает большую выталкивающую силу", user: "Морская вода плотнее пресной и создает большую выталкивающую силу", isCorrect: true, exp: "Высокая плотность соленой воды выталкивает тело сильнее." },
  { id: 40, text: "Первая обязанность при помощи бессознательному дайверу на поверхности?", correct: "Обеспечить положительную плавучесть себе и пострадавшему", user: "Обеспечить положительную плавучесть себе и пострадавшему", isCorrect: true, exp: "Надуть BCD и сбросить грузы — основа спасения на воде." },
  { id: 41, text: "Главное назначение сигнального буя (DSMB / SMB)?", correct: "Обозначить местоположение дайвера для судов и команды на боте", user: "Обозначить местоположение дайвера для судов и команды на боте", isCorrect: true, exp: "Буй на поверхности предупреждает капитана о точке всплытия." },

function renderQuestions(filter = 'all') {
    const container = document.getElementById('questions-list');
    container.innerHTML = '';

    questionsData.forEach(q => {
        if (filter === 'wrong' && q.isCorrect) return;
        if (filter === 'correct' && !q.isCorrect) return;

        const card = document.createElement('div');
        card.className = `q-card ${q.isCorrect ? 'status-correct' : 'status-wrong'}`;

        let statusBadge = q.isCorrect 
            ? '<span class="badge badge-correct">ВЕРНО</span>' 
            : '<span class="badge badge-wrong">ОШИБКА</span>';

        let answersHtml = '';
        if (q.isCorrect) {
            answersHtml = `<div class="answer-box ans-correct"><strong>Твой ответ:</strong> ${q.user}</div>`;
        } else {
            answersHtml = `
                <div class="answer-box ans-user-wrong"><strong>Твой ответ (неверно):</strong> ${q.user}</div>
                <div class="answer-box ans-correct"><strong>Правильный ответ:</strong> ${q.correct}</div>
            `;
        }

        card.innerHTML = `
            <div class="q-header">
                <div class="q-title">Вопрос №${q.id}</div>
                ${statusBadge}
            </div>
            <p><strong>${q.text}</strong></p>
            ${answersHtml}
            <div class="explanation">💡 <strong>Пояснение:</strong> ${q.exp}</div>
        `;

        container.appendChild(card);
    });
}

function filterQuestions(type) {
    document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderQuestions(type);
}

// Первоначальный рендер всех вопросов
renderQuestions('all');
